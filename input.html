<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة الحسابات والأقسام والصفحات والأعمدة</title>
  <style>
    :root {
      --primary: #1B557F;
      --secondary: #F47B00;
      --bg: #F4F7F9;
      --card: #FFFFFF;
      --text: #333333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 25px;
    }
    h2 {
      color: var(--primary);
      text-align: center;
      margin-top: 0;
      border-bottom: 2px solid var(--secondary);
      padding-bottom: 10px;
    }
    button {
      position: relative;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s ease;
      white-space: nowrap; /* إيقاف التفاف النص للأزرار */
    }
    button:active { transform: scale(0.96); }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-secondary { background-color: var(--secondary); color: white; }
    .btn-danger { background-color: #E53E3E; color: white; }
    .btn-warning { background-color: #D69E2E; color: white; }
    .btn-success { background-color: #38A169; color: white; }
    .btn-sm { padding: 5px 8px; font-size: 0.8em; }

    /* البحث العلوي */
    .search-box-container {
      position: relative;
      margin-bottom: 25px;
      background: #EBF8FF;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #BEE3F8;
    }
    .search-results {
      position: absolute;
      top: 100%; right: 15px; left: 15px;
      background: white;
      border: 1px solid #CBD5E0;
      border-radius: 0 0 8px 8px;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 100;
      display: none;
    }
    .search-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #EDF2F7; }
    .search-item:hover { background: #F7FAFC; color: var(--secondary); }

    .section-block {
      background: #FAFAFA;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .section-title { font-weight: bold; color: var(--primary); margin-bottom: 12px; font-size: 1.1em; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9em; }
    input, select {
      width: 100%; padding: 10px; border: 1px solid #CCC; border-radius: 6px; box-sizing: border-box;
    }
    .accordion-header {
      display: flex; justify-content: space-between; align-items: center;
      background: #EDF2F7; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; color: var(--primary); margin-top: 10px;
    }
    .accordion-content { display: none; padding: 15px 10px 5px 10px; background: #FFF; border: 1px solid #EDF2F7; }
    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 550px; max-height: 85vh; overflow-y: auto; }
    
    /* أسطر الأعمدة والأزرار المدمجة */
    .column-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFF;
      border: 1px solid #E2E8F0;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      gap: 10px;
    }
    .column-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .column-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>لوحة التحكم الهيكلية والتحكم بالأعمدة</h2>

  <!-- 🔍 مربع البحث الذكي أعلى الصفحة -->
  <div class="search-box-container">
    <label style="color:var(--primary); font-size:1em;">🔍 البحث السريع عن صفحة:</label>
    <input type="text" id="globalSearchInput" placeholder="سجل اسم أو جزء من اسم الصفحة..." oninput="onGlobalSearch()">
    <div class="search-results" id="searchResults"></div>
  </div>

  <!-- 1. الحسابات -->
  <div class="section-block">
    <div class="section-title">🏢 الحسابات (إضافة مجلد)</div>
    <div class="form-group">
      <label>اختر الحساب:</label>
      <select id="accountSelect" onchange="onAccountChange()">
        <option value="">-- اختر الحساب --</option>
      </select>
    </div>
    <div class="accordion-header" onclick="toggleAccordion('accAcc')">
      <span>+ إضافة مجلد حساب جديد</span><span>▼</span>
    </div>
    <div class="accordion-content" id="accAcc">
      <div class="form-group"><label>اسم الحساب (C1):</label><input type="text" id="accName"></div>
      <div class="form-group"><label>موقع الحساب (C2):</label><input type="text" id="accLoc"></div>
      <button class="btn-secondary" onclick="addAccount()">إنشاء مجلد الحساب</button>
    </div>
  </div>

  <!-- 2. الأقسام -->
  <div class="section-block">
    <div class="section-title">📊 الأقسام (إضافة جدول داخل مجلد الحساب)</div>
    <div class="form-group">
      <label>اختر القسم (الجدول):</label>
      <select id="sectionSelect" onchange="onSectionChange()">
        <option value="">-- اختر القسم --</option>
      </select>
    </div>
    <div class="accordion-header" onclick="toggleAccordion('secAcc')">
      <span>+ إضافة جدول قسم جديد</span><span>▼</span>
    </div>
    <div class="accordion-content" id="secAcc">
      <div class="form-group"><label>اسم القسم (C6):</label><input type="text" id="secName"></div>
      <div class="form-group"><label>عنوان القسم الظاهر (C9):</label><input type="text" id="secTitle"></div>
      <button class="btn-secondary" onclick="addSectionTable()">إنشاء جدول القسم</button>
    </div>
  </div>

  <!-- 3. الصفحات -->
  <div class="section-block">
    <div class="section-title">📄 الصفحات (إضافة ورقة داخل القسم)</div>
    <div class="form-group">
      <label>اختر الصفحة:</label>
      <select id="pageSelect" onchange="onPageChange()">
        <option value="">-- اختر الصفحة --</option>
      </select>
    </div>
    <div class="accordion-header" onclick="toggleAccordion('pageAcc')">
      <span>+ إضافة ورقة صفحة جديدة</span><span>▼</span>
    </div>
    <div class="accordion-content" id="pageAcc">
      <div class="form-group"><label>اسم الصفحة (C11):</label><input type="text" id="pageNameInput"></div>
      <div class="form-group"><label>عنوان الصفحة الظاهر (C12):</label><input type="text" id="pageTitleInput"></div>
      <div class="form-group"><label>عنوان الصفحة الرئيسي (A1:C1):</label><input type="text" id="pageMainTitleInput"></div>
      <div class="form-group"><label>مفاتيح البحث (C17):</label><input type="text" id="pageSearchKeysInput"></div>
      <button class="btn-secondary" onclick="addPageSheet()">إضافة ورقة الصفحة</button>
    </div>
  </div>

  <!-- 4. إضافة وتنسيق الأعمدة (تظهر مباشرة تحت القائمة المنسدلة للصفحات) -->
  <div class="section-block">
    <div class="section-title">⚙️ إضافة وتنسيق الأعمدة</div>
    <p style="font-size:0.85em; color:#666;">الأعمدة المسجلة للصفحة المختارة:</p>
    
    <div id="columnsListContainer"></div>

    <div class="btn-group" style="margin-top:15px;">
      <button class="btn-secondary" onclick="openAddColModal()">+ إضافة عمود</button>
      <button class="btn-primary" onclick="saveAllColumnChanges()">💾 حفظ التغييرات</button>
    </div>
  </div>
</div>

<!-- Modal نافذة إضافة/تعديل عمود الديناميكية -->
<div class="modal" id="colModal">
  <div class="modal-content">
    <h3 style="color:var(--primary); margin-top:0;" id="colModalTitle">إضافة عمود جديد</h3>
    <input type="hidden" id="colEditIndex">

    <!-- C21: اسم العمود -->
    <div class="form-group" id="field_C21">
      <label id="label_C21">اسم العمود:</label>
      <input type="text" id="input_C21">
    </div>

    <!-- C22: نوع البيانات -->
    <div class="form-group" id="field_C22">
      <label id="label_C22">نوع البيانات:</label>
      <select id="input_C22" onchange="onDataTypeChange()"></select>
    </div>

    <!-- C24: طريقة العرض والإخفاء -->
    <div class="form-group" id="field_C24">
      <label id="label_C24">طريقة العرض والإخفاء:</label>
      <select id="input_C24">
        <option value="">إظهار كامل</option>
        <option value="*#">إخفاء كامل</option>
        <option value="#">إخفاء من الإضافة</option>
        <option value="*">إخفاء من العرض</option>
      </select>
    </div>

    <!-- C25: الالتزام بالمدخلات -->
    <div class="form-group" id="field_C25" style="display:none;">
      <label id="label_C25">الالتزام بالمدخلات:</label>
      <select id="input_C25">
        <option value="">اختياري</option>
        <option value="#">إلزامى</option>
      </select>
    </div>

    <!-- C26: للقراءة فقط -->
    <div class="form-group" id="field_C26" style="display:none;">
      <label id="label_C26">للقراءة فقط:</label>
      <select id="input_C26">
        <option value="">تحرير</option>
        <option value="%">للعرض</option>
      </select>
    </div>

    <!-- C27: بداية التسلسل -->
    <div class="form-group" id="field_C27" style="display:none;">
      <label id="label_C27">بداية التسلسل:</label>
      <input type="number" id="input_C27" value="1">
    </div>

    <!-- C28: مفتاح البحث -->
    <div class="form-group" id="field_C28" style="display:none;">
      <label id="label_C28">مفتاح البحث:</label>
      <select id="input_C28"></select>
    </div>

    <!-- C29: العمود المجلوب منه البيانات -->
    <div class="form-group" id="field_C29" style="display:none;">
      <label id="label_C29">العمود المجلوب منه البيانات:</label>
      <input type="text" id="input_C29" placeholder="G">
    </div>

    <!-- C30: تعطيل العمود -->
    <div class="form-group" id="field_C30" style="display:none;">
      <label id="label_C30">تعطيل العمود:</label>
      <select id="input_C30">
        <option value="مفعل">إلغاء التعطيل</option>
        <option value="معطل">تعطيل</option>
      </select>
    </div>

    <!-- C31: تسجيل شفرة -->
    <div class="form-group" id="field_C31" style="display:none;">
      <label id="label_C31">تسجيل شفرة:</label>
      <input type="text" id="input_C31">
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="confirmColumnTemp()">موافق</button>
      <button class="btn-danger" onclick="closeColModal()">إلغاء</button>
    </div>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwI2wtEM6krl1X7ug4KBBf-8iz4fbW4eAcWUCNY652i4SwZSNC4bY34AvAyJEzHQTr_Ww/exec";

  let allData = [];
  let dataTypesList = [];
  let visibilityMatrix = {};
  let fieldHeaders = {};
  let validationRules = {};
  let currentTempColumns = [];

  window.onload = function() { loadData(); };

  function toggleAccordion(id) {
    const el = document.getElementById(id);
    el.style.display = el.style.display === "block" ? "none" : "block";
  }

  function loadData() {
    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "GET_INITIAL_DATA", payload: {} })
    })
    .then(res => res.json())
    .then(data => {
      if(data.success) {
        allData = data.rows;
        dataTypesList = data.dataTypes;
        visibilityMatrix = data.visibilityMatrix;
        fieldHeaders = data.fieldHeaders;
        validationRules = data.validationRules;

        applyHeadersUI();
        populateDataTypesSelect();
        populateAccounts();
      }
    });
  }

  // تطبيق عناوين الحقول من الصف الأول بالجدول E1:R27
  function applyHeadersUI() {
    for (let key in fieldHeaders) {
      const lbl = document.getElementById(`label_${key}`);
      if (lbl && fieldHeaders[key]) {
        lbl.innerText = `${fieldHeaders[key]}:`;
      }
    }
  }

  function populateDataTypesSelect() {
    const sel = document.getElementById("input_C22");
    sel.innerHTML = "";
    dataTypesList.forEach(t => {
      sel.innerHTML += `<option value="${t.typeName}" data-sym="${t.typeSymbol}">${t.typeName}</option>`;
    });
  }

  // الفلترة الحية والمباشرة - قراءة الأسطر المتوفرة بالفهرس A فقط
  function populateAccounts() {
    const sel = document.getElementById("accountSelect");
    sel.innerHTML = '<option value="">-- اختر الحساب --</option>';
    const codes = [...new Set(allData.map(i => i.accountCode))];
    codes.forEach(c => {
      const item = allData.find(i => i.accountCode === c);
      if(item) sel.innerHTML += `<option value="${item.accountCode}">${item.accountName} (${item.accountLocation})</option>`;
    });
    onAccountChange();
  }

  function onAccountChange() {
    const accCode = document.getElementById("accountSelect").value;
    const sel = document.getElementById("sectionSelect");
    sel.innerHTML = '<option value="">-- اختر القسم --</option>';
    if(accCode) {
      const sections = [...new Set(allData.filter(i => i.accountCode === accCode && i.sectionTableUrl).map(i => i.sectionTableUrl))];
      sections.forEach(sUrl => {
        const item = allData.find(i => i.sectionTableUrl === sUrl);
        if(item) sel.innerHTML += `<option value="${item.sectionTableUrl}">${item.sectionName} - ${item.sectionTitle}</option>`;
      });
    }
    onSectionChange();
  }

  function onSectionChange() {
    const sUrl = document.getElementById("sectionSelect").value;
    const sel = document.getElementById("pageSelect");
    sel.innerHTML = '<option value="">-- اختر الصفحة --</option>';
    if(sUrl) {
      const pages = allData.filter(i => i.sectionTableUrl === sUrl && i.pageName);
      const uniquePages = [];
      pages.forEach(p => {
        if(!uniquePages.some(x => x.pageName === p.pageName)) uniquePages.push(p);
      });
      uniquePages.forEach(p => {
        sel.innerHTML += `<option value="${p.pageName}">${p.pageName} (${p.pageTitle})</option>`;
      });
    }
    onPageChange();
  }

  function onPageChange() {
    const sUrl = document.getElementById("sectionSelect").value;
    const pName = document.getElementById("pageSelect").value;

    currentTempColumns = [];
    if(sUrl && pName) {
      const cols = allData.filter(i => i.sectionTableUrl === sUrl && i.pageName === pName && i.colOrder !== "" && i.colOrder !== undefined);
      cols.sort((a,b) => parseInt(a.colOrder) - parseInt(b.colOrder));
      currentTempColumns = cols.map(c => ({
        colName: c.colName,
        colDataType: c.colDataType,
        colDataSymbol: c.colDataSymbol,
        colVisibility: c.colVisibility,
        colRequired: c.colRequired,
        colReadOnly: c.colReadOnly,
        colSerial: c.colSerial,
        colSearchKey: c.colSearchKey,
        colSourceCol: c.colSourceCol,
        colStatus: c.colStatus || "مفعل",
        colCodeScript: c.colCodeScript
      }));
    }
    renderTempColumns();
  }

  // عرض الأعمدة مع زر التعديل وزر التفعيل/التعطيل الحركي وزر الحذف
  function renderTempColumns() {
    const container = document.getElementById("columnsListContainer");
    container.innerHTML = "";

    if(currentTempColumns.length === 0) {
      container.innerHTML = '<p style="color:#999; text-align:center;">لا توجد أعمدة معروضة.</p>';
      return;
    }

    currentTempColumns.forEach((col, idx) => {
      const isDisabled = col.colStatus === "معطل";
      const toggleBtnText = isDisabled ? "تفعيل" : "تعطيل";
      const toggleBtnClass = isDisabled ? "btn-success" : "btn-warning";

      container.innerHTML += `
        <div class="column-row">
          <div class="column-title">
            <strong>${idx + 1}. ${col.colName}</strong> 
            <small style="color:${isDisabled ? '#E53E3E' : '#666'};">(${col.colDataType} ${isDisabled ? '- معطل' : ''})</small>
          </div>
          <div class="column-actions">
            <button class="btn-primary btn-sm" onclick="openEditColModal(${idx})">تعديل</button>
            <button class="${toggleBtnClass} btn-sm" onclick="toggleColumnStatus(${idx})">${toggleBtnText}</button>
            <button class="btn-danger btn-sm" onclick="deleteTempColumn(${idx})">حذف</button>
          </div>
        </div>
      `;
    });
  }

  // الضغط على زر "تعطيل/تفعيل" لتبديل الخلية C30 مباشرة
  function toggleColumnStatus(idx) {
    const currentStatus = currentTempColumns[idx].colStatus;
    currentTempColumns[idx].colStatus = (currentStatus === "معطل") ? "مفعل" : "معطل";
    renderTempColumns();
  }

  // تطبيق شروط الإظهار الإخفاء بناءً على الجدول E!E1:R27 و المرجع H1...
  function onDataTypeChange() {
    const dataTypeSel = document.getElementById("input_C22");
    const selectedOption = dataTypeSel.options[dataTypeSel.selectedIndex];
    const hRef = selectedOption ? selectedOption.getAttribute("data-sym") : "H0";

    const rules = visibilityMatrix[hRef] || {};

    const keys = ["C25", "C26", "C27", "C28", "C29", "C31"];
    keys.forEach(key => {
      const grp = document.getElementById(`field_${key}`);
      if (grp) {
        if (rules[key] === "Yes") {
          grp.style.display = "block";
        } else {
          grp.style.display = "none";
        }
      }
    });
  }

  function openAddColModal() {
    if(!document.getElementById("pageSelect").value) return alert("يرجى اختيار الصفحة أولاً");
    document.getElementById("colModalTitle").innerText = "إضافة عمود جديد";
    document.getElementById("colEditIndex").value = "";
    document.getElementById("input_C21").value = "";
    document.getElementById("field_C30").style.display = "none";

    populateSearchKeysDropdown();
    onDataTypeChange();
    document.getElementById("colModal").style.display = "flex";
  }

  function openEditColModal(idx) {
    const col = currentTempColumns[idx];
    document.getElementById("colModalTitle").innerText = "تعديل بيانات العمود";
    document.getElementById("colEditIndex").value = idx;
    document.getElementById("input_C21").value = col.colName;
    document.getElementById("input_C22").value = col.colDataType;
    document.getElementById("input_C24").value = col.colVisibility;
    document.getElementById("input_C25").value = col.colRequired;
    document.getElementById("input_C26").value = col.colReadOnly;
    document.getElementById("input_C30").value = col.colStatus || "مفعل";
    document.getElementById("field_C30").style.display = "block";

    populateSearchKeysDropdown();

    if(col.colSerial) document.getElementById("input_C27").value = col.colSerial.replace(/[\(\)]/g, '');
    if(col.colSourceCol) document.getElementById("input_C29").value = col.colSourceCol.replace('/', '');
    if(col.colCodeScript) document.getElementById("input_C31").value = col.colCodeScript;

    onDataTypeChange();
    document.getElementById("colModal").style.display = "flex";
  }

  function populateSearchKeysDropdown() {
    const sel = document.getElementById("input_C28");
    sel.innerHTML = "";
    currentTempColumns.forEach((c, i) => {
      const sym = String.fromCharCode(65 + i);
      sel.innerHTML += `<option value="/${sym}">[${sym}] ${c.colName}</option>`;
    });
  }

  function closeColModal() { document.getElementById("colModal").style.display = "none"; }

  // التحقق الديناميكي من الحقول الإلزامية بناءً على الجدول E35:G45
  function confirmColumnTemp() {
    const editIdx = document.getElementById("colEditIndex").value;
    const dataTypeSel = document.getElementById("input_C22");
    const selectedOption = dataTypeSel.options[dataTypeSel.selectedIndex];
    const hRef = selectedOption ? selectedOption.getAttribute("data-sym") : "H0";
    const currentVisRules = visibilityMatrix[hRef] || {};

    // خريطة الإدخالات
    const fieldInputs = {
      "C21": document.getElementById("input_C21").value.trim(),
      "C22": document.getElementById("input_C22").value,
      "C24": document.getElementById("input_C24").value,
      "C25": document.getElementById("input_C25").value,
      "C26": document.getElementById("input_C26").value,
      "C27": document.getElementById("input_C27").value,
      "C28": document.getElementById("input_C28").value,
      "C29": document.getElementById("input_C29").value.trim(),
      "C30": document.getElementById("input_C30").value,
      "C31": document.getElementById("input_C31").value.trim()
    };

    // فحص الإلزام الحقول الظاهرة فقط
    for (let key in fieldInputs) {
      const isVisible = (key === "C21" || key === "C22" || key === "C24") || (currentVisRules[key] === "Yes") || (key === "C30" && editIdx !== "");
      if (isVisible) {
        const isRequired = validationRules[key] === "الزامي" || validationRules[key] === "إلزامى";
        if (isRequired && !fieldInputs[key]) {
          const titleName = fieldHeaders[key] || key;
          return alert(`عفواً، حقل (${titleName}) إلزامي ولا يمكن حده فارغاً.`);
        }
      }
    }

    let colSerial = "";
    if(fieldInputs["C27"]) colSerial = `(${fieldInputs["C27"]})`;

    let colSourceCol = "";
    if(fieldInputs["C29"]) colSourceCol = fieldInputs["C29"].startsWith("/") ? fieldInputs["C29"] : `/${fieldInputs["C29"]}`;

    const colObj = {
      colName: fieldInputs["C21"],
      colDataType: fieldInputs["C22"],
      colDataSymbol: hRef,
      colVisibility: fieldInputs["C24"],
      colRequired: fieldInputs["C25"],
      colReadOnly: fieldInputs["C26"],
      colSerial: colSerial,
      colSearchKey: fieldInputs["C28"],
      colSourceCol: colSourceCol,
      colStatus: fieldInputs["C30"] || "مفعل",
      colCodeScript: fieldInputs["C31"]
    };

    if(editIdx === "") {
      currentTempColumns.push(colObj);
    } else {
      currentTempColumns[parseInt(editIdx)] = colObj;
    }

    renderTempColumns();
    closeColModal();
  }

  function deleteTempColumn(idx) {
    currentTempColumns.splice(idx, 1);
    renderTempColumns();
  }

  function saveAllColumnChanges() {
    const sUrl = document.getElementById("sectionSelect").value;
    const pName = document.getElementById("pageSelect").value;

    if(!sUrl || !pName) return alert("يرجى اختيار القسم والصفحة أولاً");

    sendRequest("SAVE_ALL_COLUMN_CHANGES", {
      tableUrl: sUrl,
      pageName: pName,
      columns: currentTempColumns
    });
  }

  function onGlobalSearch() {
    const query = document.getElementById("globalSearchInput").value.trim().toLowerCase();
    const resDiv = document.getElementById("searchResults");
    resDiv.innerHTML = "";

    if(!query) { resDiv.style.display = "none"; return; }

    const matches = allData.filter(i => i.pageName && i.pageName.toLowerCase().includes(query));
    if(matches.length === 0) {
      resDiv.innerHTML = '<div class="search-item">لا توجد نتائج مطابقة</div>';
    } else {
      const unique = [];
      matches.forEach(m => {
        if(!unique.some(u => u.sectionTableUrl === m.sectionTableUrl && u.pageName === m.pageName)) unique.push(m);
      });

      unique.forEach(m => {
        resDiv.innerHTML += `
          <div class="search-item" onclick="selectSearchResult('${m.accountCode}', '${m.sectionTableUrl}', '${m.pageName}')">
            📍 <strong>${m.pageName}</strong> <small>(${m.accountName} / ${m.sectionName})</small>
          </div>
        `;
      });
    }
    resDiv.style.display = "block";
  }

  function selectSearchResult(accCode, sUrl, pName) {
    document.getElementById("searchResults").style.display = "none";
    document.getElementById("accountSelect").value = accCode;
    onAccountChange();
    document.getElementById("sectionSelect").value = sUrl;
    onSectionChange();
    document.getElementById("pageSelect").value = pName;
    onPageChange();
  }

  function addAccount() {
    sendRequest("ADD_ACCOUNT", {
      accountName: document.getElementById("accName").value,
      accountLocation: document.getElementById("accLoc").value
    });
  }

  function addSectionTable() {
    sendRequest("ADD_SECTION_TABLE", {
      accountCode: document.getElementById("accountSelect").value,
      sectionName: document.getElementById("secName").value,
      sectionTitle: document.getElementById("secTitle").value
    });
  }

  function addPageSheet() {
    sendRequest("ADD_PAGE_SHEET", {
      sectionTableUrl: document.getElementById("sectionSelect").value,
      pageName: document.getElementById("pageNameInput").value,
      pageTitle: document.getElementById("pageTitleInput").value,
      mainTitle: document.getElementById("pageMainTitleInput").value,
      searchKeys: document.getElementById("pageSearchKeysInput").value
    });
  }

  function sendRequest(action, payload) {
    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: action, payload: payload })
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message || data.error);
      if(data.success) loadData();
    });
  }
</script>
</body>
</html>
