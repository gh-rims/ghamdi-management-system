<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>نظام إدارة الجداول</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    Arial,
    Tahoma,
    sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:#172033;
  color:#fff;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:700;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:
    0 2px 10px
    rgba(0,0,0,.06);
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  cursor:pointer;
  font-size:15px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#172033;
  color:#fff;
}

.success{
  background:#16834b;
  color:#fff;
}

.danger{
  background:#c62828;
  color:#fff;
}

.secondary{
  background:#e5e7eb;
  color:#222;
}

select,
input{
  width:100%;
  padding:11px;
  border:
    1px solid #d5d8de;
  border-radius:8px;
  background:#fff;
  font-size:15px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(220px,1fr)
    );
  gap:12px;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:6px;
}

.required{
  color:#c62828;
}

.field small{
  display:block;
  margin-top:5px;
  color:#777;
}

.table-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:12px;
}

.table-wrap{
  overflow:auto;
}

.data-table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

.data-table th,
.data-table td{
  border-bottom:
    1px solid #eee;
  padding:10px;
  text-align:right;
}

.data-table th{
  background:#f0f2f5;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  padding:25px;
  color:#777;
}

.loading{
  text-align:center;
  padding:25px;
  color:#777;
}

.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:99;
  background:#222;
  color:#fff;
  padding:13px 17px;
  border-radius:9px;
  display:none;
  max-width:90%;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:50;
}

.modal-box{
  background:#fff;
  width:
    min(
      700px,
      100%
    );
  max-height:90vh;
  overflow:auto;
  border-radius:14px;
  padding:18px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  background:#eee;
  border-radius:50%;
  width:36px;
  height:36px;
  padding:0;
  font-size:20px;
}

@media(max-width:600px){

  header{
    font-size:19px;
  }

  .container{
    padding:10px;
  }

  .card{
    padding:12px;
  }

  .toolbar button{
    flex:1;
  }

}

</style>

</head>


<body>

<header>
  نظام إدارة الجداول
</header>


<div class="container">

  <div class="card">

    <div class="toolbar">

      <div
        style="
          flex:1;
          min-width:220px;
        "
      >

        <select id="tableSelect">

          <option value="">
            جاري تحميل الجداول...
          </option>

        </select>

      </div>


      <button
        class="primary"
        onclick="loadSelectedTable()"
      >
        فتح الجدول
      </button>


      <button
        class="success"
        onclick="openAdd()"
      >
        ＋ إضافة سجل
      </button>

    </div>

  </div>


  <div id="content"></div>

</div>


<!-- ========================= -->
<!-- نافذة النموذج -->
<!-- ========================= -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h3 id="modalTitle">
        إضافة سجل
      </h3>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <div id="form"></div>


    <div
      class="actions"
      style="margin-top:15px"
    >

      <button
        id="saveButton"
        class="success"
        onclick="saveRecord()"
      >
        حفظ
      </button>

      <button
        class="secondary"
        onclick="closeModal()"
      >
        إلغاء
      </button>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>


// ================================================================
// رابط Web App
// ================================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbw2FA_As7StLELc0xApapxVDYNa1dcYJT8dxQe06JBMp_fd8OsyLOq57KAECkG3MuxaGA/exec";


// ================================================================
// متغيرات النظام
// ================================================================

let tables = [];

let currentTable = null;

let currentConfig = null;

let editRow = null;


// ================================================================
// رسالة
// ================================================================

function toast(
  message,
  success = true
){

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    message;

  element.style.display =
    "block";

  element.style.background =
    success
      ? "#222"
      : "#b71c1c";

  setTimeout(
    function(){

      element.style.display =
        "none";

    },
    3500
  );
}


// ================================================================
// تحويل الأرقام العربية
// ================================================================

function arabicToEnglish(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /[٠-٩]/g,
    function(d){

      return "٠١٢٣٤٥٦٧٨٩"
        .indexOf(d);

    }
  )
  .replace(
    /٫/g,
    "."
  )
  .replace(
    /٬/g,
    ","
  );
}


// ================================================================
// GET
// ================================================================

async function get(
  action,
  params = {}
){

  const url =
    new URL(API_URL);

  url.searchParams.set(
    "action",
    action
  );

  Object.keys(params)
    .forEach(
      function(key){

        url.searchParams.set(
          key,
          params[key]
        );

      }
    );

  const response =
    await fetch(
      url.toString(),
      {
        redirect:"follow"
      }
    );

  if (!response.ok){

    throw new Error(
      "تعذر الاتصال بالخادم"
    );
  }

  const json =
    await response.json();

  if (!json.success){

    throw new Error(
      json.error ||
      "خطأ في الخادم"
    );
  }

  return json.data;
}


// ================================================================
// POST
// ================================================================

async function post(
  payload
){

  /*
   * نستخدم text/plain
   * لتجنب OPTIONS preflight
   */

  const response =
    await fetch(
      API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            payload
          ),

        redirect:"follow"
      }
    );

  if (!response.ok){

    throw new Error(
      "تعذر الاتصال بالخادم"
    );
  }

  const json =
    await response.json();

  if (!json.success){

    throw new Error(
      json.error ||
      "خطأ في الخادم"
    );
  }

  return json.data;
}


// ================================================================
// بدء النظام
// ================================================================

async function init(){

  try{

    tables =
      await get(
        "tables"
      );

    const select =
      document.getElementById(
        "tableSelect"
      );

    select.innerHTML =
      '<option value="">اختر الجدول</option>' +

      tables
        .map(
          function(table){

            return `
              <option value="${esc(table.Table_ID)}">
                ${esc(table.Icon || "📋")}
                ${esc(
                  table.Table_Title ||
                  table.Table_Name
                )}
              </option>
            `;

          }
        )
        .join("");


    if (
      tables.length > 0
    ){

      select.value =
        tables[0].Table_ID;

      await loadSelectedTable();

    }

  }
  catch(error){

    showError(
      error.message
    );

  }

}


// ================================================================
// فتح الجدول
// ================================================================

async function loadSelectedTable(){

  const id =
    document.getElementById(
      "tableSelect"
    ).value;

  if (!id){

    toast(
      "اختر جدولًا أولًا",
      false
    );

    return;
  }


  try{

    currentTable =
      tables.find(
        function(table){

          return String(
            table.Table_ID
          ) === String(id);

        }
      ) || null;


    currentConfig =
      await get(
        "form",
        {
          tableId:id
        }
      );


    await renderTable(id);

  }
  catch(error){

    showError(
      error.message
    );

  }

}


// ================================================================
// عرض الجدول
// ================================================================

async function renderTable(
  id
){

  const box =
    document.getElementById(
      "content"
    );

  box.innerHTML =
    `
      <div class="card loading">
        جاري تحميل البيانات...
      </div>
    `;


  try{

    const data =
      await get(
        "table",
        {
          tableId:id
        }
      );


    currentConfig =
      {
        ...currentConfig,
        ...data
      };


    const columns =
      data.columns.filter(
        function(column){

          return column.Visible !==
            "مخفي";

        }
      );


    let html = `

      <div class="card">

        <div class="table-title">

          ${esc(
            data.table.Icon ||
            "📋"
          )}

          ${esc(
            data.table.Table_Title ||
            data.table.Table_Name
          )}

        </div>


        <div class="toolbar">

          <input
            id="search"
            placeholder="بحث..."
            oninput="searchTable()"
          >


          <button
            class="success"
            onclick="openAdd()"
          >
            ＋ إضافة
          </button>

        </div>


        <div class="table-wrap">

          <table class="data-table">

            <thead>

              <tr>

                ${
                  columns
                    .map(
                      function(column){

                        return `
                          <th>
                            ${esc(
                              column.Column_Name
                            )}
                          </th>
                        `;

                      }
                    )
                    .join("")
                }

                <th>
                  إجراءات
                </th>

              </tr>

            </thead>


            <tbody id="tbody">

              ${
                rowsHtml(
                  data.rows,
                  columns
                )
              }

            </tbody>

          </table>

        </div>

      </div>

    `;


    box.innerHTML =
      html;

  }
  catch(error){

    showError(
      error.message
    );

  }

}


// ================================================================
// الصفوف
// ================================================================

function rowsHtml(
  rows,
  columns
){

  if (
    !rows ||
    !rows.length
  ){

    return `
      <tr>
        <td
          colspan="${columns.length + 1}"
          class="empty"
        >
          لا توجد بيانات
        </td>
      </tr>
    `;

  }


  return rows
    .map(
      function(row){

        return `

          <tr>

            ${
              columns
                .map(
                  function(column){

                    return `
                      <td>
                        ${esc(
                          formatValue(
                            row.displayValues[
                              column.Column_Name
                            ],
                            column
                          )
                        )}
                      </td>
                    `;

                  }
                )
                .join("")
            }


            <td>

              <div class="actions">

                <button
                  class="primary"
                  onclick="openEdit(${row.rowNumber})"
                >
                  تعديل
                </button>


                <button
                  class="danger"
                  onclick="removeRecord(${row.rowNumber})"
                >
                  حذف
                </button>

              </div>

            </td>

          </tr>

        `;

      }
    )
    .join("");

}


// ================================================================
// البحث
// ================================================================

async function searchTable(){

  if (!currentTable){
    return;
  }


  const input =
    document.getElementById(
      "search"
    );

  const query =
    input
      ? input.value
      : "";


  try{

    const data =
      await get(
        "search",
        {
          tableId:
            currentTable.Table_ID,

          q:
            query
        }
      );


    const columns =
      data.columns.filter(
        function(column){

          return column.Visible !==
            "مخفي";

        }
      );


    const body =
      document.getElementById(
        "tbody"
      );


    if (body){

      body.innerHTML =
        rowsHtml(
          data.rows,
          columns
        );

    }

  }
  catch(error){

    toast(
      error.message,
      false
    );

  }

}


// ================================================================
// تنسيق القيمة
// ================================================================

function formatValue(
  value,
  column
){

  if (
    value === null ||
    value === undefined
  ){

    return "";
  }

  return String(value);
}


// ================================================================
// إضافة
// ================================================================

function openAdd(){

  if (!currentTable){

    toast(
      "اختر جدولًا أولًا",
      false
    );

    return;
  }


  editRow = null;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "إضافة سجل";


  buildForm();


  document.getElementById(
    "modal"
  ).style.display =
    "flex";

}


// ================================================================
// تعديل
// ================================================================

async function openEdit(
  rowNumber
){

  try{

    editRow =
      rowNumber;


    const record =
      await get(
        "record",
        {
          tableId:
            currentTable.Table_ID,

          rowNumber:
            rowNumber
        }
      );


    document.getElementById(
      "modalTitle"
    ).textContent =
      "تعديل سجل";


    buildForm(
      record.data
    );


    document.getElementById(
      "modal"
    ).style.display =
      "flex";

  }
  catch(error){

    toast(
      error.message,
      false
    );

  }

}


// ================================================================
// إغلاق النموذج
// ================================================================

function closeModal(){

  document.getElementById(
    "modal"
  ).style.display =
    "none";


  document.getElementById(
    "form"
  ).innerHTML =
    "";

}


// ================================================================
// بناء النموذج
// ================================================================

function buildForm(
  values = {}
){

  const fields =
    (
      currentConfig.fields ||
      currentConfig.columns ||
      []
    )
    .filter(
      function(column){

        return column.Visible !==
          "مخفي";

      }
    );


  document.getElementById(
    "form"
  ).innerHTML =

    '<div class="grid">' +

    fields
      .map(
        function(column){

          return fieldHtml(
            column,
            values
          );

        }
      )
      .join("") +

    '</div>';

}


// ================================================================
// حقل النموذج
// ================================================================

function fieldHtml(
  column,
  values
){

  const name =
    column.Column_Name;

  const type =
    column.Data_Type;

  const required =
    column.Required ===
    "إلزامي";

  const auto =
    type ===
    "رقم تسلسلي";


  let value =
    values[name];


  if (
    value === null ||
    value === undefined
  ){

    value =
      column.Default ??
      column.Default_Value ??
      "";

  }


  if (
    auto
  ){

    return `

      <div class="field">

        <label>
          ${esc(name)}
        </label>


        <input
          disabled
          value="${esc(value)}"
        >


        <input
          type="hidden"
          data-name="${esc(name)}"
          value="${esc(value)}"
        >

      </div>

    `;

  }


  let input = "";


  // --------------------------------
  // قائمة منسدلة
  // --------------------------------

  if (
    type ===
    "قائمة منسدلة"
  ){

    const options =
      (
        currentConfig
          .dropdownOptions &&
        currentConfig
          .dropdownOptions[name]
      ) || [];


    input = `

      <select
        data-name="${esc(name)}"
      >

        <option value="">
          اختر...
        </option>


        ${
          options
            .map(
              function(option){

                return `

                  <option
                    value="${esc(option)}"
                    ${
                      String(option) ===
                      String(value)
                        ? "selected"
                        : ""
                    }
                  >
                    ${esc(option)}
                  </option>

                `;

              }
            )
            .join("")
        }

      </select>

    `;


    if (
      column.Allow_New_Option ===
      "نعم"
    ){

      input += `

        <input
          style="margin-top:6px"
          data-new-option="${esc(name)}"
          placeholder="أو اكتب خيارًا جديدًا"
        >

      `;

    }

  }


  // --------------------------------
  // True / False
  // --------------------------------

  else if (
    type ===
    "True / False"
  ){

    input = `

      <select
        data-name="${esc(name)}"
      >

        <option value="">
          اختر...
        </option>


        <option
          value="true"
          ${
            value === true ||
            String(value) === "true"
              ? "selected"
              : ""
          }
        >
          نعم
        </option>


        <option
          value="false"
          ${
            value === false ||
            String(value) === "false"
              ? "selected"
              : ""
          }
        >
          لا
        </option>

      </select>

    `;

  }


  // --------------------------------
  // الحقول الأخرى
  // --------------------------------

  else {

    let inputType =
      "text";


    if (
      type === "رقم" ||
      type === "مبلغ مالي" ||
      type === "نسبة مئوية"
    ){

      inputType =
        "number";

    }


    if (
      type === "تاريخ"
    ){

      inputType =
        "date";

    }


    if (
      type === "وقت"
    ){

      inputType =
        "time";

    }


    if (
      type === "رابط"
    ){

      inputType =
        "url";

    }


    input = `

      <input
        type="${inputType}"
        data-name="${esc(name)}"
        value="${esc(value)}"
        ${
          required
            ? "required"
            : ""
        }
      >

    `;

  }


  return `

    <div class="field">

      <label>

        ${esc(name)}

        ${
          required
            ? '<span class="required">*</span>'
            : ""
        }

      </label>


      ${input}


      ${
        column.Condition_Message
          ? `
            <small>
              ${esc(
                column.Condition_Message
              )}
            </small>
          `
          : ""
      }

    </div>

  `;

}


// ================================================================
// جمع بيانات النموذج
// ================================================================

function collectForm(){

  const data = {};


  document
    .querySelectorAll(
      "#form [data-name]"
    )
    .forEach(
      function(element){

        const name =
          element.getAttribute(
            "data-name"
          );


        const column =
          currentConfig.fields.find(
            function(field){

              return (
                field.Column_Name ===
                name
              );

            }
          );


        // الرقم التسلسلي
        if (
          column &&
          column.Data_Type ===
          "رقم تسلسلي"
        ){

          return;

        }


        // القائمة المنسدلة
        if (
          element.tagName ===
          "SELECT"
        ){

          data[name] =
            element.value;

          return;

        }


        // الرقم
        if (
          element.type ===
          "number"
        ){

          data[name] =
            arabicToEnglish(
              element.value
            );

          return;

        }


        data[name] =
          element.value;

      }
    );


  // --------------------------------
  // خيار جديد في القائمة
  // --------------------------------

  document
    .querySelectorAll(
      "#form [data-new-option]"
    )
    .forEach(
      function(input){

        const name =
          input.getAttribute(
            "data-new-option"
          );

        const value =
          input.value.trim();


        if (value){

          data[name] =
            value;

        }

      }
    );


  return data;

}


// ================================================================
// حفظ
// ================================================================

async function saveRecord(){

  if (!currentTable){
    return;
  }


  const button =
    document.getElementById(
      "saveButton"
    );


  if (button){
    button.disabled = true;
  }


  try{

    const data =
      collectForm();


    let payload;


    // --------------------------------
    // إضافة
    // --------------------------------

    if (
      editRow === null
    ){

      payload = {

        action:
          "add",

        tableId:
          currentTable.Table_ID,

        data:
          data,

        // للتوافق مع أي نسخة قديمة
        values:
          data

      };

    }


    // --------------------------------
    // تعديل
    // --------------------------------

    else {

      payload = {

        action:
          "update",

        tableId:
          currentTable.Table_ID,

        rowNumber:
          editRow,

        data:
          data,

        // للتوافق
        values:
          data

      };

    }


    await post(
      payload
    );


    const wasEdit =
      editRow !== null;


    closeModal();


    toast(
      wasEdit
        ? "تم تعديل السجل بنجاح"
        : "تم حفظ السجل بنجاح"
    );


    await renderTable(
      currentTable.Table_ID
    );


  }
  catch(error){

    toast(
      error.message ||
      "خطأ في الخادم",
      false
    );

  }
  finally{

    if (button){
      button.disabled = false;
    }

  }

}


// ================================================================
// حذف
// ================================================================

async function removeRecord(
  rowNumber
){

  if (
    !confirm(
      "هل أنت متأكد من حذف هذا السجل؟"
    )
  ){

    return;
  }


  try{

    await post({

      action:
        "delete",

      tableId:
        currentTable.Table_ID,

      rowNumber:
        rowNumber

    });


    toast(
      "تم حذف السجل بنجاح"
    );


    await renderTable(
      currentTable.Table_ID
    );

  }
  catch(error){

    toast(
      error.message ||
      "خطأ في الخادم",
      false
    );

  }

}


// ================================================================
// عرض خطأ
// ================================================================

function showError(
  message
){

  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="card empty">

      حدث خطأ:

      <br><br>

      ${esc(message)}

    </div>

  `;

}


// ================================================================
// حماية HTML
// ================================================================

function esc(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


// ================================================================
// تشغيل النظام
// ================================================================

window.addEventListener(
  "load",
  init
);

</script>
