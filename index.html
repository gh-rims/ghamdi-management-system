<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الجداول الديناميكي - الإصدار 3.0</title>
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
        }
        .table-hover tbody tr:hover {
            background-color: #f1f3f5;
        }
        .sortable {
            cursor: pointer;
        }
        .sortable:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<div class="container my-4">
    <!-- Header Card -->
    <div class="card shadow-sm mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h3 class="mb-0"><i class="fa-solid fa-table me-2"></i>نظام إدارة الجداول الديناميكي v3.0</h3>
            <span class="badge bg-light text-primary">متوافق مع GitHub Pages</span>
        </div>
        <div class="card-body">
            <!-- Controls Toolbar -->
            <div class="row g-2 mb-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-search"></i></span>
                        <input type="text" id="searchInput" class="form-control" placeholder="بحث في الجدول...">
                    </div>
                </div>
                <div class="col-md-8 d-flex gap-2 justify-content-md-end flex-wrap">
                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#rowModal" onclick="prepareAddModal()">
                        <i class="fa-solid fa-plus me-1"></i> إضافة عنصر
                    </button>
                    <button class="btn btn-primary" onclick="exportToCSV()">
                        <i class="fa-solid fa-file-csv me-1"></i> تصدير CSV
                    </button>
                    <label class="btn btn-secondary mb-0">
                        <i class="fa-solid fa-file-import me-1"></i> استيراد CSV
                        <input type="file" id="importCsvInput" accept=".csv" style="display: none;" onchange="importFromCSV(event)">
                    </label>
                    <button class="btn btn-danger" onclick="resetData()">
                        <i class="fa-solid fa-rotate-right me-1"></i> إعادة ضبط
                    </button>
                </div>
            </div>

            <!-- Table Section -->
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle" id="dynamicTable">
                    <thead class="table-dark">
                        <tr id="tableHeader">
                            <!-- Dynamic Columns rendered by JS -->
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Dynamic Rows rendered by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Adding / Editing Rows -->
<div class="modal fade" id="rowModal" tabindex="-1" aria-labelledby="rowModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="rowModalLabel">إضافة / تعديل عنصر</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body">
                <form id="rowForm">
                    <input type="hidden" id="rowIndex">
                    <div id="dynamicFormFields">
                        <!-- Form fields generated dynamically -->
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" onclick="saveRow()">حفظ التغييرات</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Main Script v3.0 -->
<script>
    // System Schema and Initial Data
    const defaultSchema = [
        { key: 'id', title: 'المعرف', type: 'number' },
        { key: 'name', title: 'الاسم', type: 'text' },
        { key: 'category', title: 'الفئة', type: 'text' },
        { key: 'status', title: 'الحالة', type: 'text' },
        { key: 'price', title: 'السعر ($)', type: 'number' }
    ];

    const initialData = [
        { id: 1, name: 'خادم سحابي', category: 'البنية التحتية', status: 'نشط', price: 120 },
        { id: 2, name: 'قاعدة بيانات PostgreSQL', category: 'البيانات', status: 'نشط', price: 80 },
        { id: 3, name: 'نظام التخزين الموزع', category: 'التخزين', status: 'متوقف', price: 45 }
    ];

    let schema = JSON.parse(localStorage.getItem('dt_schema')) || defaultSchema;
    let tableData = JSON.parse(localStorage.getItem('dt_data')) || initialData;
    let currentSort = { column: null, ascending: true };

    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
        renderTable();
        document.getElementById('searchInput').addEventListener('input', renderTable);
    });

    // Save state to LocalStorage
    function saveData() {
        localStorage.setItem('dt_data', JSON.stringify(tableData));
        localStorage.setItem('dt_schema', JSON.stringify(schema));
    }

    // Render Table
    function renderTable() {
        const headerRow = document.getElementById('tableHeader');
        const body = document.getElementById('tableBody');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();

        // Render Headers
        headerRow.innerHTML = schema.map(col => `
            <th class="sortable" onclick="sortTable('${col.key}')">
                ${col.title} <i class="fa-solid fa-sort fs-6"></i>
            </th>
        `).join('') + '<th class="text-center">الإجراءات</th>';

        // Filter Data
        let filteredData = tableData.filter(row => {
            return schema.some(col => String(row[col.key] || '').toLowerCase().includes(searchTerm));
        });

        // Render Body
        if (filteredData.length === 0) {
            body.innerHTML = `<tr><td colspan="${schema.length + 1}" class="text-center text-muted">لا توجد بيانات للعرض</td></tr>`;
            return;
        }

        body.innerHTML = filteredData.map((row, index) => `
            <tr>
                ${schema.map(col => `<td>${row[col.key] !== undefined ? row[col.key] : ''}</td>`).join('')}
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="prepareEditModal(${index})">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteRow(${index})">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    // Sort Functionality
    function sortTable(columnKey) {
        if (currentSort.column === columnKey) {
            currentSort.ascending = !currentSort.ascending;
        } else {
            currentSort.column = columnKey;
            currentSort.ascending = true;
        }

        tableData.sort((a, b) => {
            let valA = a[columnKey] ?? '';
            let valB = b[columnKey] ?? '';
            if (typeof valA === 'number' && typeof valB === 'number') {
                return currentSort.ascending ? valA - valB : valB - valA;
            }
            return currentSort.ascending 
                ? String(valA).localeCompare(String(valB)) 
                : String(valB).localeCompare(String(valA));
        });

        saveData();
        renderTable();
    }

    // Modal Form Preparation
    function prepareAddModal() {
        document.getElementById('rowIndex').value = '';
        document.getElementById('rowModalLabel').innerText = 'إضافة عنصر جديد';
        generateFormFields({});
    }

    function prepareEditModal(index) {
        document.getElementById('rowIndex').value = index;
        document.getElementById('rowModalLabel').innerText = 'تعديل العنصر';
        generateFormFields(tableData[index]);
        const modal = new bootstrap.Modal(document.getElementById('rowModal'));
        modal.show();
    }

    function generateFormFields(data) {
        const container = document.getElementById('dynamicFormFields');
        container.innerHTML = schema.map(col => `
            <div class="mb-3">
                <label class="form-label">${col.title}</label>
                <input type="${col.type || 'text'}" class="form-control" id="field_${col.key}" value="${data[col.key] ?? ''}">
            </div>
        `).join('');
    }

    // Add/Edit Save Handler
    function saveRow() {
        const index = document.getElementById('rowIndex').value;
        let newRow = {};

        schema.forEach(col => {
            const inputVal = document.getElementById(`field_${col.key}`).value;
            newRow[col.key] = col.type === 'number' ? Number(inputVal) : inputVal;
        });

        if (index === '') {
            tableData.push(newRow);
        } else {
            tableData[index] = newRow;
        }

        saveData();
        renderTable();

        const modalElement = document.getElementById('rowModal');
        const modal = bootstrap.Modal.getInstance(modalElement);
        modal.hide();
    }

    // Delete Row
    function deleteRow(index) {
        if (confirm('هل أنت تأكد من إزالة هذا العنصر؟')) {
            tableData.splice(index, 1);
            saveData();
            renderTable();
        }
    }

    // Reset Data
    function resetData() {
        if (confirm('هل ترغب في إعادة ضبط البيانات إلى الحالة الافتراضية؟')) {
            schema = defaultSchema;
            tableData = initialData;
            saveData();
            renderTable();
        }
    }

    // Export CSV
    function exportToCSV() {
        let csvContent = "\uFEFF"; // UTF-8 BOM for Arabic support
        csvContent += schema.map(c => `"${c.title}"`).join(",") + "\n";

        tableData.forEach(row => {
            let rowArray = schema.map(c => `"${row[c.key] ?? ''}"`);
            csvContent += rowArray.join(",") + "\n";
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", "table_data_v3.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Import CSV
    function importFromCSV(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split('\n').filter(line => line.trim() !== '');
            if (lines.length < 2) return;

            const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
            
            // Re-generate schema based on imported header
            schema = headers.map((h, i) => ({ key: `col_${i}`, title: h, type: 'text' }));

            tableData = lines.slice(1).map(line => {
                const values = line.split(',').map(v => v.replace(/"/g, '').trim());
                let row = {};
                headers.forEach((_, i) => {
                    row[`col_${i}`] = values[i] || '';
                });
                return row;
            });

            saveData();
            renderTable();
        };
        reader.readAsText(file, 'UTF-8');
    }
</script>
</body>
</html>
